<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description">
  <title id="title">Encrypted channel admission through a blind relay</title>
  <desc id="description">A joiner proves possession of a public key. An authorized member admits it, advances the channel key epoch, and sends an encrypted welcome through a relay that cannot decrypt it. Subsequent channel messages use the shared epoch key.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .heading { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }
      .message { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .cipher { stroke: #7c3aed; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="790" rx="24" fill="#ffffff"/>
  <text x="48" y="54" class="title">Encrypted channel admission through blind relays</text>

  <rect x="80" y="88" width="260" height="72" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="118" text-anchor="middle" class="heading">Joining peer</text>
  <text x="210" y="143" text-anchor="middle" class="small">owns private key J</text>
  <rect x="470" y="88" width="260" height="72" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="118" text-anchor="middle" class="heading">Blind relay</text>
  <text x="600" y="143" text-anchor="middle" class="small">peer or hosted intermediary</text>
  <rect x="860" y="88" width="260" height="72" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="990" y="118" text-anchor="middle" class="heading">Authorized member</text>
  <text x="990" y="143" text-anchor="middle" class="small">already holds epoch key K(n)</text>

  <line x1="210" y1="160" x2="210" y2="724" class="lifeline"/>
  <line x1="600" y1="160" x2="600" y2="724" class="lifeline"/>
  <line x1="990" y1="160" x2="990" y2="724" class="lifeline"/>

  <text x="48" y="208" class="label">1</text>
  <line x1="218" y1="218" x2="590" y2="218" class="message"/>
  <text x="404" y="205" text-anchor="middle" class="label">Public key J + proof of possession</text>
  <line x1="608" y1="262" x2="980" y2="262" class="message"/>
  <text x="794" y="249" text-anchor="middle" class="small">forward participation request</text>

  <text x="48" y="332" class="label">2</text>
  <rect x="846" y="300" width="288" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="990" y="329" text-anchor="middle" class="label">Approve peer J</text>
  <text x="990" y="353" text-anchor="middle" class="small">advance epoch n → n+1</text>
  <text x="990" y="375" text-anchor="middle" class="small">derive new group key K(n+1)</text>

  <text x="48" y="444" class="label">3</text>
  <line x1="982" y1="432" x2="610" y2="432" class="cipher"/>
  <text x="796" y="417" text-anchor="middle" class="label">Welcome encrypted for public key J</text>
  <line x1="592" y1="476" x2="220" y2="476" class="cipher"/>
  <text x="406" y="461" text-anchor="middle" class="small">relay forwards opaque ciphertext</text>

  <text x="48" y="556" class="label">4</text>
  <rect x="66" y="518" width="288" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="547" text-anchor="middle" class="label">Decrypt with private key J</text>
  <text x="210" y="571" text-anchor="middle" class="small">obtain current group key K(n+1)</text>
  <text x="210" y="593" text-anchor="middle" class="small">past epoch keys are not included</text>

  <text x="48" y="666" class="label">5</text>
  <line x1="218" y1="650" x2="590" y2="650" class="cipher"/>
  <line x1="608" y1="690" x2="980" y2="690" class="cipher"/>
  <text x="600" y="636" text-anchor="middle" class="label">Channel messages encrypted with K(n+1)</text>
  <text x="600" y="714" text-anchor="middle" class="small">the relay sees opaque ChannelID, message ID, class, epoch, expiry, and size—not content or keys</text>

  <rect x="296" y="738" width="608" height="34" rx="12" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="600" y="760" text-anchor="middle" class="small">Public keys may be public; only the matching private key opens the welcome.</text>
</svg>
